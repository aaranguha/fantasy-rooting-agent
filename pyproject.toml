[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-rooting-agent"
version = "1.0.0"
description = "Cross-league fantasy football primetime rooting decision engine"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
twilio = ["twilio>=8.0"]
# Only needed by scripts/grab_espn_cookies.py to decrypt Chromium's cookie store.
cookies = ["cryptography>=42.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
fantasy-agent = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
