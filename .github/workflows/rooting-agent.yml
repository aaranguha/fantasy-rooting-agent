name: Fantasy Rooting Agent

# Runs the whole notification pipeline every 5 minutes. That's plenty of
# resolution: the app's own logic has a 12-minute grace window around kickoff
# and a 3-hour one for the morning preview, so a 5-minute cadence never misses
# a window. The minute list is offset by 2 (2,7,12,...) rather than a plain
# */5 - GitHub's scheduler deprioritizes jobs queued at round 5-minute
# boundaries under load, since every OTHER schedule on the platform tends to
# fire there too; an off-beat offset gets serviced more reliably.
#
# Nothing here needs your Mac. ESPN, Sleeper and Telegram are all reached over
# the internet from GitHub's runners; the only thing this can't do is iMessage
# (no macOS runner, no Messages.app) - which is exactly why Telegram/ntfy exist.
#
# The `push` trigger below is what actually gets a schedule/workflow_dispatch-
# only workflow reliably registered by GitHub right away - without it, a brand
# new workflow can sit unindexed (invisible to `gh workflow list`, un-runnable
# via `gh workflow run`) for an unpredictable stretch after its first push.
on:
  push:
    branches: [master]
    paths: [".github/workflows/rooting-agent.yml"]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the GitHub UI to test

# Never let two runs race on the same state; queue instead of overlapping.
concurrency:
  group: fantasy-agent
  cancel-in-progress: false

permissions:
  contents: write   # so the job can commit the updated SQLite state back

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Write secrets to .env (never committed)
        run: |
          cat > .env <<EOF
          ESPN_S2=${{ secrets.ESPN_S2 }}
          ESPN_SWID=${{ secrets.ESPN_SWID }}
          NOTIFIER=telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_SERVER=${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC=${{ secrets.NTFY_TOPIC }}
          FANTASY_AGENT_HOME=${{ github.workspace }}/state
          TZ=America/Los_Angeles
          EOF

      - name: Morning preview, kickoff push, live updates, Sunday slate
        run: |
          fantasy-agent morning              || echo "morning: nothing due"
          fantasy-agent sunday-morning       || echo "sunday-morning: nothing due"
          fantasy-agent sunday-second-slate  || echo "sunday-second-slate: nothing due"
          fantasy-agent run-once             || echo "run-once: nothing due"
          fantasy-agent live --once          || echo "live: nothing due"

      - name: Persist dedupe / snapshot state
        run: |
          git config user.name "fantasy-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/agent.sqlite
          git diff --cached --quiet && echo "no state change" || \
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
